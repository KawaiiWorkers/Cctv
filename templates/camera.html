<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CCTV Camera Client — {{ camera_name }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0f1a; color: #e8eef8; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: linear-gradient(135deg, #1e2a3a 0%, #0d1520 100%); padding: 1rem 1.5rem; border-bottom: 1px solid #2a3f54; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.5px; }
    .status-badge { padding: 0.35rem 0.75rem; border-radius: 999px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-badge.online { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-badge.offline { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    .status-badge.recording { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    main { flex: 1; padding: 1.5rem; display: grid; gap: 1rem; }
    .video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #050810; border-radius: 12px; overflow: hidden; border: 1px solid #1e2a3a; }
    video { width: 100%; height: 100%; object-fit: cover; background: #000; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    .stat-card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 1rem; }
    .stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; color: #6b7280; margin-bottom: 0.25rem; }
    .stat-value { font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .controls { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .btn { flex: 1; min-width: 120px; padding: 0.875rem 1rem; border: none; border-radius: 10px; font-weight: 600; font-size: 0.875rem; cursor: pointer; transition: all 0.15s ease; }
    .btn-primary { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-danger { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); color: white; }
    .btn-secondary { background: #1f2937; color: #e5e7eb; border: 1px solid #374151; }
    .log-panel { background: #050810; border: 1px solid #1e2a3a; border-radius: 10px; padding: 0.75rem; max-height: 200px; overflow-y: auto; font-family: 'SF Mono', Monaco, monospace; font-size: 0.7rem; line-height: 1.5; }
    .log-entry { color: #9ca3af; border-bottom: 1px solid #111827; padding: 0.25rem 0; }
    .log-entry.success { color: #10b981; }
    .log-entry.error { color: #ef4444; }
    .log-entry.warn { color: #f59e0b; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>📷 {{ camera_name }}</h1>
    <span id="statusBadge" class="status-badge offline">OFFLINE</span>
  </header>
  <main>
    <div class="video-wrap">
      <video id="localVideo" playsinline muted></video>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Chunks Uploaded</div><div class="stat-value" id="chunksCount">0</div></div>
      <div class="stat-card"><div class="stat-label">Current Chunk</div><div class="stat-value" id="currentChunk">0s / 15s</div></div>
      <div class="stat-card"><div class="stat-label">Uptime</div><div class="stat-value" id="uptime">00:00:00</div></div>
      <div class="stat-card"><div class="stat-label">WebRTC</div><div class="stat-value" id="webrtcStatus">Disconnected</div></div>
    </div>
    <div class="controls">
      <button id="btnStart" class="btn btn-primary">Start Recording</button>
      <button id="btnStop" class="btn btn-danger hidden">Stop Recording</button>
    </div>
    <div class="log-panel" id="logPanel"></div>
  </main>

  <script>
// ─── CONFIG ───
const CAMERA_ID = "{{ camera_id }}";
const CAMERA_NAME = "{{ camera_name }}";
const API_BASE = ""; // same origin
const CHUNK_MINUTES = 0.25; // 15 seconds
const CHUNK_MS = CHUNK_MINUTES * 60 * 1000;
const VIDEO_BITRATE = 2_500_000; // 2.5 Mbps
const PING_INTERVAL = 10_000; // 10s
const WEBRTC_POLL_INTERVAL = 2_000; // 2s
const STUN_SERVERS = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

// ─── STATE ───
let mediaStream = null;
let mediaRecorder = null;
let peerConnection = null;
let chunkIndex = 0;
let chunksUploaded = 0;
let recordingStartTime = 0;
let chunkTimer = null;
let pingTimer = null;
let webrtcPollTimer = null;
let uptimeTimer = null;
let currentChunkBytes = [];

// ─── DOM ───
const $ = (sel) => document.querySelector(sel);
const statusBadge = $('#statusBadge');
const localVideo = $('#localVideo');
const chunksCountEl = $('#chunksCount');
const currentChunkEl = $('#currentChunk');
const uptimeEl = $('#uptime');
const webrtcStatusEl = $('#webrtcStatus');
const btnStart = $('#btnStart');
const btnStop = $('#btnStop');
const logPanel = $('#logPanel');

// ─── LOGGING ───
function log(msg, type = 'info') {
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logPanel.prepend(entry);
  if (logPanel.children.length > 50) logPanel.lastChild.remove();
}

function setStatus(online, recording = false) {
  statusBadge.className = 'status-badge ' + (recording ? 'recording' : (online ? 'online' : 'offline'));
  statusBadge.textContent = recording ? 'RECORDING' : (online ? 'ONLINE' : 'OFFLINE');
}

// ─── MEDIA & RECORDING ───
async function initCamera() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: 'environment' },
      audio: false
    });
    localVideo.srcObject = mediaStream;
    await localVideo.play();
    log('Camera initialized at 1080p', 'success');
    setStatus(true);
    registerCamera();
    startPingLoop();
    startWebRTCPoll();
    startUptime();
  } catch (err) {
    log(`Camera access denied: ${err.message}`, 'error');
    setStatus(false);
  }
}

function startRecording() {
  if (!mediaStream) return;
  try {
    mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: VIDEO_BITRATE });
    
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) currentChunkBytes.push(e.data);
    };
    
    mediaRecorder.onstop = async () => {
      const blob = new Blob(currentChunkBytes, { type: 'video/webm' });
      currentChunkBytes = [];
      await uploadChunk(blob);
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        // Restart for next chunk
        startChunkTimer();
      }
    };
    
    mediaRecorder.start(1000); // timeslice 1s for smooth dataavailable
    startChunkTimer();
    
    btnStart.classList.add('hidden');
    btnStop.classList.remove('hidden');
    recordingStartTime = Date.now();
    log('Recording started (15s chunks, 2.5 Mbps)', 'success');
    setStatus(true, true);
  } catch (err) {
    log(`Recording failed: ${err.message}`, 'error');
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    clearTimeout(chunkTimer);
    chunkTimer = null;
  }
  btnStart.classList.remove('hidden');
  btnStop.classList.add('hidden');
  setStatus(true, false);
  log('Recording stopped', 'warn');
}

function startChunkTimer() {
  const start = Date.now();
  function update() {
    const elapsed = Date.now() - start;
    const remaining = Math.max(0, CHUNK_MS - elapsed);
    currentChunkEl.textContent = `${(elapsed/1000).toFixed(1)}s / ${(CHUNK_MS/1000).toFixed(0)}s`;
    if (remaining > 0) {
      chunkTimer = setTimeout(update, 100);
    }
  }
  update();
}

async function uploadChunk(blob) {
  const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const formData = new FormData();
  formData.append('camera_id', CAMERA_ID);
  formData.append('chunk_index', chunkIndex);
  formData.append('timestamp', timestamp);
  formData.append('video', blob, `chunk_${chunkIndex}.webm`);
  
  try {
    const res = await fetch(`${API_BASE}/api/camera/upload_chunk`, { method: 'POST', body: formData });
    const data = await res.json();
    if (res.ok) {
      chunksUploaded++;
      chunksCountEl.textContent = chunksUploaded;
      chunkIndex++;
      log(`Chunk ${chunkIndex} uploaded ✓`, 'success');
    } else {
      log(`Upload failed: ${data.error}`, 'error');
    }
  } catch (err) {
    log(`Upload error: ${err.message}`, 'error');
  }
}

// ─── WEBSOCKET-FREE WebRTC SIGNALING (Polling) ───
async function initPeerConnection() {
  peerConnection = new RTCPeerConnection(STUN_SERVERS);
  
  // Add local stream tracks
  mediaStream.getTracks().forEach(track => peerConnection.addTrack(track, mediaStream));
  
  peerConnection.onicecandidate = (e) => {
    if (e.candidate) {
      sendIceCandidate('camera', e.candidate.toJSON());
    }
  };
  
  peerConnection.onconnectionstatechange = () => {
    const state = peerConnection.connectionState;
    webrtcStatusEl.textContent = state.charAt(0).toUpperCase() + state.slice(1);
    if (state === 'connected') {
      log('WebRTC connected — live streaming active', 'success');
    } else if (state === 'disconnected' || state === 'failed') {
      log(`WebRTC ${state}`, 'warn');
    }
  };
  
  // Check for offer from admin
  await pollForOffer();
}

async function pollForOffer() {
  if (!peerConnection) return;
  try {
    const res = await fetch(`${API_BASE}/api/camera/ping`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ camera_id: CAMERA_ID })
    });
    const data = await res.json();
    if (data.offer && peerConnection.signalingState !== 'have-local-offer') {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      await sendAnswer(answer);
      log('WebRTC offer received, answer sent', 'success');
    }
    // Process ICE candidates from admin
    const iceRes = await fetch(`${API_BASE}/api/admin/webrtc/ice/${CAMERA_ID}`);
    const iceData = await iceRes.json();
    if (iceData.candidates?.length) {
      for (const c of iceData.candidates) {
        try { await peerConnection.addIceCandidate(new RTCIceCandidate(c)); } catch {}
      }
    }
  } catch (err) {
    // Silent fail on poll
  }
  webrtcPollTimer = setTimeout(pollForOffer, WEBRTC_POLL_INTERVAL);
}

async function sendAnswer(answer) {
  await fetch(`${API_BASE}/api/camera/webrtc/answer`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ camera_id: CAMERA_ID, answer: answer.toJSON() })
  });
}

async function sendIceCandidate(source, candidate) {
  await fetch(`${API_BASE}/api/camera/webrtc/ice`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ camera_id: CAMERA_ID, candidate })
  });
}

function startWebRTCPoll() {
  if (peerConnection) return;
  initPeerConnection();
}

// ─── CAMERA REGISTRATION & HEARTBEAT ───
async function registerCamera() {
  try {
    await fetch(`${API_BASE}/api/camera/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ camera_id: CAMERA_ID, name: CAMERA_NAME })
    });
    log('Registered with server', 'success');
  } catch (err) {
    log(`Registration failed: ${err.message}`, 'error');
  }
}

function startPingLoop() {
  async function ping() {
    try {
      await fetch(`${API_BASE}/api/camera/ping`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ camera_id: CAMERA_ID })
      });
    } catch {}
    pingTimer = setTimeout(ping, PING_INTERVAL);
  }
  ping();
}

function startUptime() {
  const start = Date.now();
  function update() {
    const diff = Date.now() - start;
    const h = String(Math.floor(diff/36e5)).padStart(2,'0');
    const m = String(Math.floor((diff%36e5)/6e4)).padStart(2,'0');
    const s = String(Math.floor((diff%6e4)/1000)).padStart(2,'0');
    uptimeEl.textContent = `${h}:${m}:${s}`;
    uptimeTimer = setTimeout(update, 1000);
  }
  update();
}

// ─── EVENT LISTENERS ───
btnStart.addEventListener('click', startRecording);
btnStop.addEventListener('click', stopRecording);

// ─── CLEANUP ON UNLOAD ───
window.addEventListener('beforeunload', () => {
  stopRecording();
  clearTimeout(pingTimer);
  clearTimeout(webrtcPollTimer);
  clearTimeout(uptimeTimer);
  clearTimeout(chunkTimer);
  if (peerConnection) peerConnection.close();
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
});

// ─── INIT ───
initCamera();
  </script>
</body>
</html>
