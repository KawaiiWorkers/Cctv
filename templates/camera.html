<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Camera • CCTV</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#e6edf7;
         display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}
    .header{width:100%;max-width:600px;text-align:center;margin-bottom:16px}
    .header h1{font-size:20px;margin-bottom:4px}
    .header .sub{opacity:.6;font-size:13px}
    .video-wrap{position:relative;width:100%;max-width:600px;border-radius:14px;overflow:hidden;
                background:#000;aspect-ratio:16/9;border:1px solid #22304d}
    video{width:100%;height:100%;object-fit:cover}
    .badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.65);padding:4px 10px;
           border-radius:8px;font-size:12px;display:flex;align-items:center;gap:6px}
    .dot{width:8px;height:8px;border-radius:50%;background:#ff4444;animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .status{width:100%;max-width:600px;margin-top:14px;padding:12px 16px;background:#131b2e;
            border:1px solid #22304d;border-radius:10px;font-size:13px}
    .status .row{display:flex;justify-content:space-between;padding:3px 0}
    .status .label{opacity:.6}
    .status .val{font-weight:600}
    .online{color:#4ade80}.offline{color:#ff7676}
    .controls{width:100%;max-width:600px;margin-top:14px;display:flex;gap:10px}
    button{flex:1;padding:12px;border:0;border-radius:10px;font-size:14px;font-weight:600;
           cursor:pointer;transition:.15s}
    .btn-start{background:#4c8dff;color:#fff}
    .btn-stop{background:#ff4444;color:#fff}
    .btn-rec-toggle{background:#22304d;color:#e6edf7;border:1px solid #2a3a5c}
    button:active{transform:scale(.97)}
    .hidden{display:none}
    .error{width:100%;max-width:600px;margin-top:10px;padding:10px 14px;background:#2a1517;
           border:1px solid #ff4444;border-radius:8px;font-size:13px;color:#ff7676}
    
    .logs-container{width:100%;max-width:600px;margin-top:14px;background:#0a0f1a;border:1px solid #22304d;
                    border-radius:10px;padding:10px;height:160px;overflow-y:auto;font-family:monospace;
                    font-size:12px;line-height:1.5;color:#8b9dc3}
    .logs-container .log-line{margin-bottom:2px;word-break:break-all}
    .logs-container .log-line.success{color:#4ade80}
    .logs-container .log-line.error{color:#ff7676}
    .logs-container .log-line.info{color:#4c8dff}
  </style>
</head>
<body>
  <div class="header">
    <h1>🎥 Camera Sensor</h1>
    <div class="sub">This device streams live video to the CCTV dashboard</div>
  </div>

  <div class="video-wrap">
    <video id="preview" autoplay muted playsinline></video>
    <div class="badge hidden" id="recBadge"><span class="dot"></span> REC</div>
  </div>

  <div class="status">
    <div class="row"><span class="label">Camera ID</span><span class="val" id="camId">—</span></div>
    <div class="row"><span class="label">Name</span><span class="val" id="camName">—</span></div>
    <div class="row"><span class="label">Status</span><span class="val offline" id="camStatus">Not started</span></div>
    <div class="row"><span class="label">Auto-record</span><span class="val" id="recStatus">OFF</span></div>
    <div class="row"><span class="label">Recording Timer</span><span class="val" id="recTimer">0/15s</span></div>
    <div class="row"><span class="label">Clips Saved</span><span class="val" id="savedCount">0</span></div>
    <div class="row"><span class="label">Viewers</span><span class="val" id="viewerCount">0</span></div>
  </div>

  <div class="controls">
    <button class="btn-start" id="startBtn">Start Camera</button>
    <button class="btn-stop hidden" id="stopBtn">Stop</button>
    <button class="btn-rec-toggle" id="recToggleBtn">Auto-Record: OFF</button>
  </div>

  <div class="logs-container" id="logBox">
    <div class="log-line info">[System] Waiting for camera to start...</div>
  </div>

  <div class="error hidden" id="errBox"></div>

<script>
const API = '';  // Relative URLs

let cameraId   = localStorage.getItem('cctv_camera_id') || '';
let cameraName = localStorage.getItem('cctv_camera_name') || '';
let localStream = null;
let pingTimer   = null;
let mediaRecorder = null;
let autoRecord  = false;
let peerConnections = new Map();
let iceServers  = [{ urls: 'stun:stun.l.google.com:19302' }];
let viewerCount = 0;
let clipsSaved  = 0;
let recInterval = null;

const CLIP_DURATION = 15;  // 15 seconds per clip

const $ = id => document.getElementById(id);
const video = $('preview');
const startBtn = $('startBtn');
const stopBtn  = $('stopBtn');
const recToggleBtn = $('recToggleBtn');
const errBox  = $('errBox');

function log(msg, type = '') {
  const time = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.className = `log-line ${type}`;
  line.textContent = `[${time}] ${msg}`;
  $('logBox').appendChild(line);
  $('logBox').scrollTop = $('logBox').scrollHeight;
}

function showError(msg) {
  errBox.textContent = msg;
  errBox.classList.remove('hidden');
  log(msg, 'error');
  setTimeout(() => errBox.classList.add('hidden'), 5000);
}

function setStatus(text, online) {
  const el = $('camStatus');
  el.textContent = text;
  el.className = 'val ' + (online ? 'online' : 'offline');
}

async function loadConfig() {
  try {
    const res = await fetch(`${API}/api/config`);
    const data = await res.json();
    if (data.iceServers) iceServers = data.iceServers;
    log('Loaded WebRTC config', 'info');
  } catch (e) { log('Failed to load config', 'error'); }
}

async function registerCamera() {
  if (!cameraName) {
    const ua = navigator.userAgent;
    let platform = 'Device';
    if (/iPhone|iPad|iPod/.test(ua)) platform = 'iOS';
    else if (/Android/.test(ua)) platform = 'Android';
    else if (/Windows/.test(ua)) platform = 'Windows';
    else if (/Mac/.test(ua)) platform = 'Mac';
    cameraName = `${platform}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
  }

  try {
    const res = await fetch(`${API}/api/camera/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ camera_id: cameraId || undefined, name: cameraName }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    cameraId   = data.camera_id;
    cameraName = data.name;
    localStorage.setItem('cctv_camera_id', cameraId);
    localStorage.setItem('cctv_camera_name', cameraName);
    $('camId').textContent = cameraId;
    $('camName').textContent = cameraName;
    setStatus('Online', true);
    log(`Registered as ${cameraName} (${cameraId})`, 'success');
  } catch (e) {
    showError(`Registration failed: ${e.message}`);
    throw e;
  }
}

async function ping() {
  try {
    const res = await fetch(`${API}/api/camera/ping`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ camera_id: cameraId }),
    });
    if (res.status === 404) {
      log('Server lost registry. Re-registering...', 'info');
      await registerCamera();
      return;
    }
    if (!res.ok) return;
    const data = await res.json();
    if (data.pending_offers && data.pending_offers.length > 0) {
      log(`Received ${data.pending_offers.length} WebRTC offer(s)`, 'info');
      for (const offer of data.pending_offers) {
        handleOffer(offer);
      }
    }
  } catch (e) {
    log(`Ping failed: ${e.message}`, 'error');
  }
}

async function handleOffer(offer) {
  const sessionId = offer.session;
  if (peerConnections.has(sessionId)) return;

  try {
    const pc = new RTCPeerConnection({ iceServers });
    peerConnections.set(sessionId, pc);
    viewerCount++;
    $('viewerCount').textContent = viewerCount;
    log(`Starting WebRTC connection for viewer...`);

    if (localStream) {
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    }

    await pc.setRemoteDescription({ type: 'offer', sdp: offer.sdp });
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    await fetch(`${API}/api/webrtc/answer`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: sessionId, sdp: answer.sdp }),
    });
    log('Answer sent to dashboard', 'success');

    pc.onicecandidate = async (event) => {
      if (event.candidate) {
        await fetch(`${API}/api/webrtc/ice`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session: sessionId, candidate: event.candidate, to: 'admin' }),
        });
      }
    };

    const icePoll = setInterval(async () => {
      if (pc.connectionState === 'closed' || pc.connectionState === 'failed') {
        clearInterval(icePoll);
        peerConnections.delete(sessionId);
        viewerCount = Math.max(0, viewerCount - 1);
        $('viewerCount').textContent = viewerCount;
        return;
      }
      try {
        const res = await fetch(`${API}/api/webrtc/ice?session=${sessionId}&to=camera`);
        const data = await res.json();
        if (data.candidates && data.candidates.length > 0) {
          for (const c of data.candidates) await pc.addIceCandidate(c);
        }
      } catch (e) { /* ignore */ }
    }, 1000);

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'connected') log('Viewer connected!', 'success');
      if (pc.connectionState === 'closed' || pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
        clearInterval(icePoll);
        peerConnections.delete(sessionId);
        viewerCount = Math.max(0, viewerCount - 1);
        $('viewerCount').textContent = viewerCount;
        log('Viewer disconnected', 'error');
      }
    };
  } catch (e) {
    log(`Offer handling failed: ${e.message}`, 'error');
    peerConnections.delete(sessionId);
  }
}

function startRecording() {
  if (!localStream || !autoRecord) return;

  try {
    const chunks = [];
    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9' : 'video/webm';

    mediaRecorder = new MediaRecorder(localStream, { mimeType, videoBitsPerSecond: 500000 });
    
    let elapsed = 0;
    $('recTimer').textContent = `${elapsed}/15s`;
    recInterval = setInterval(() => {
      elapsed++;
      $('recTimer').textContent = `${elapsed}/15s`;
      if (elapsed >= CLIP_DURATION) {
        clearInterval(recInterval);
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop(); // Triggers onstop
        }
      }
    }, 1000);

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      if (blob.size > 1000) await uploadClip(blob);
      if (autoRecord && localStream) {
        log('Starting next 15s clip...', 'info');
        startRecording(); // Start next clip immediately
      }
    };
    
    mediaRecorder.start();
    $('recBadge').classList.remove('hidden');
    log('Recording started (15s clip)', 'info');
  } catch (e) {
    log(`Recording failed: ${e.message}`, 'error');
    $('recBadge').classList.add('hidden');
  }
}

function stopRecording() {
  if (recInterval) clearInterval(recInterval);
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  $('recTimer').textContent = '0/15s';
  $('recBadge').classList.add('hidden');
}

async function uploadClip(blob) {
  log(`Uploading clip (${(blob.size / 1024).toFixed(1)} KB)...`);
  const formData = new FormData();
  formData.append('camera_id', cameraId);
  formData.append('file', blob, `clip-${Date.now()}.webm`);
  try {
    const res = await fetch(`${API}/api/footage/upload`, { method: 'POST', body: formData });
    if (res.ok) {
      clipsSaved++;
      $('savedCount').textContent = clipsSaved;
      log('Clip uploaded successfully', 'success');
    } else {
      log(`Upload failed: HTTP ${res.status}`, 'error');
    }
  } catch (e) {
    log(`Upload failed: ${e.message}`, 'error');
  }
}

async function startCamera() {
  try {
    startBtn.disabled = true;
    startBtn.textContent = 'Starting...';
    log('Initializing camera...');

    await loadConfig();

    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
    video.srcObject = localStream;
    log('Camera access granted', 'success');

    await registerCamera();

    pingTimer = setInterval(ping, 5000);
    ping();
    log('Heartbeat started', 'info');

    startBtn.classList.add('hidden');
    stopBtn.classList.remove('hidden');
    startBtn.disabled = false;
    startBtn.textContent = 'Start Camera';

    if (autoRecord) startRecording();
  } catch (e) {
    showError(`Failed to start: ${e.message}`);
    startBtn.disabled = false;
    startBtn.textContent = 'Start Camera';
  }
}

function stopCamera() {
  if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
  stopRecording();

  peerConnections.forEach(pc => pc.close());
  peerConnections.clear();
  viewerCount = 0;
  $('viewerCount').textContent = '0';

  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  video.srcObject = null;
  setStatus('Stopped', false);
  log('Camera stopped', 'info');

  startBtn.classList.remove('hidden');
  stopBtn.classList.add('hidden');
}

recToggleBtn.addEventListener('click', () => {
  autoRecord = !autoRecord;
  recToggleBtn.textContent = `Auto-Record: ${autoRecord ? 'ON' : 'OFF'}`;
  $('recStatus').textContent = autoRecord ? 'ON' : 'OFF';
  if (autoRecord && localStream) startRecording();
  else if (!autoRecord) stopRecording();
});

startBtn.addEventListener('click', startCamera);
stopBtn.addEventListener('click', stopCamera);

window.addEventListener('beforeunload', () => {
  if (pingTimer) clearInterval(pingTimer);
  stopRecording();
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  peerConnections.forEach(pc => pc.close());
});
</script>
</body>
</html>
