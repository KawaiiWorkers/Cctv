<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Footage • CCTV</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#e6edf7;min-height:100vh}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;
         background:#131b2e;border-bottom:1px solid #22304d;position:sticky;top:0;z-index:100}
    .nav-left{display:flex;align-items:center;gap:16px}
    .nav h1{font-size:18px}
    .nav a{color:#4c8dff;text-decoration:none;font-size:14px}
    .toolbar{display:flex;align-items:center;gap:10px;padding:14px 20px;flex-wrap:wrap}
    select{padding:8px 12px;border-radius:8px;border:1px solid #2a3a5c;background:#0e1626;
           color:#e6edf7;font-size:14px;outline:none}
    .btn{padding:8px 16px;border:0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
    .btn-danger{background:#dc3545;color:#fff}
    .btn-danger:disabled{opacity:.4;cursor:not-allowed}
    .btn-secondary{background:#22304d;color:#e6edf7;border:1px solid #2a3a5c}
    .btn-refresh{background:#4c8dff;color:#fff}
    .selection-info{font-size:13px;opacity:.7;margin-left:auto}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:0 20px 20px}
    .card{background:#131b2e;border:1px solid #22304d;border-radius:12px;overflow:hidden;transition:.15s}
    .card:hover{border-color:#3a4a6c}
    .card.selected{border-color:#4c8dff;background:#16203a}
    .card-video{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer}
    .card-video video{width:100%;height:100%;object-fit:cover}
    .card-video .play-overlay{position:absolute;inset:0;display:flex;align-items:center;
         justify-content:center;background:rgba(0,0,0,.4);opacity:0;transition:.2s}
    .card-video:hover .play-overlay{opacity:1}
    .card-video .play-icon{font-size:36px}
    .card-checkbox{position:absolute;top:8px;left:8px;z-index:5}
    .card-checkbox input{width:20px;height:20px;cursor:pointer;accent-color:#4c8dff}
    .card-info{padding:10px 14px}
    .card-info .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-info .meta{font-size:11px;opacity:.5;margin-top:3px;display:flex;gap:10px}
    .empty{text-align:center;padding:60px 20px;opacity:.5}
    .empty .icon{font-size:48px;margin-bottom:10px}
    .loading{text-align:center;padding:40px;opacity:.5}
    .select-all-wrap{display:flex;align-items:center;gap:8px}
    .select-all-wrap input{width:18px;height:18px;accent-color:#4c8dff}
    .select-all-wrap label{font-size:14px;cursor:pointer}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;
           justify-content:center;z-index:1000;padding:20px}
    .modal.active{display:flex}
    .modal video{max-width:90vw;max-height:85vh;border-radius:12px}
    .modal-close{position:absolute;top:20px;right:30px;font-size:32px;color:#fff;cursor:pointer;
                 background:rgba(0,0,0,.5);width:44px;height:44px;border-radius:50%;border:0;
                 display:flex;align-items:center;justify-content:center}
    .confirm-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;
                   justify-content:center;z-index:1000}
    .confirm-modal.active{display:flex}
    .confirm-box{background:#131b2e;border:1px solid #22304d;border-radius:16px;padding:28px;
                 max-width:400px;width:90%;text-align:center}
    .confirm-box h2{font-size:18px;margin-bottom:10px}
    .confirm-box p{font-size:14px;opacity:.7;margin-bottom:20px}
    .confirm-box .actions{display:flex;gap:10px}
    .confirm-box .actions button{flex:1;padding:10px;border:0;border-radius:8px;font-size:14px;
                                 font-weight:600;cursor:pointer}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#131b2e;
           border:1px solid #22304d;padding:12px 24px;border-radius:10px;font-size:14px;
           z-index:2000;opacity:0;transition:.3s;pointer-events:none}
    .toast.show{opacity:1}
  </style>
</head>
<body>

<div class="nav">
  <div class="nav-left">
    <h1>🎬 Footage</h1>
    <a href="/dashboard">← Dashboard</a>
  </div>
  <a href="/logout">Logout</a>
</div>

<div class="toolbar">
  <select id="camFilter">
    <option value="">All Cameras</option>
  </select>
  <button class="btn btn-refresh" id="refreshBtn">🔄 Refresh</button>

  <div class="select-all-wrap">
    <input type="checkbox" id="selectAll">
    <label for="selectAll">Select All</label>
  </div>

  <button class="btn btn-danger" id="deleteSelectedBtn" disabled>🗑 Delete Selected (<span id="selectedCount">0</span>)</button>
  <button class="btn btn-danger" id="deleteAllBtn">🗑 Delete All</button>

  <span class="selection-info" id="totalCount">0 clips</span>
</div>

<div class="loading" id="loading">Loading footage...</div>
<div class="grid" id="grid" style="display:none"></div>
<div class="empty" id="empty" style="display:none">
  <div class="icon">📁</div>
  <div>No footage found</div>
</div>

<!-- Video player modal -->
<div class="modal" id="playerModal">
  <button class="modal-close" onclick="closePlayer()">✕</button>
  <video id="player" controls autoplay></video>
</div>

<!-- Delete confirmation modal -->
<div class="confirm-modal" id="confirmModal">
  <div class="confirm-box">
    <h2 id="confirmTitle">Delete clips?</h2>
    <p id="confirmMsg">This action cannot be undone.</p>
    <div class="actions">
      <button class="btn btn-secondary" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════
//  Footage page with multi-select and batch delete
// ═══════════════════════════════════════════════════════════════════════

let allItems = [];
let selectedPaths = new Set();
let pendingDeleteAction = null;

const $ = id => document.getElementById(id);

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

// --- Load footage ---
async function loadFootage() {
  $('loading').style.display = 'block';
  $('grid').style.display = 'none';
  $('empty').style.display = 'none';

  const cam = $('camFilter').value;
  const url = cam ? `/api/footage/list?camera_id=${encodeURIComponent(cam)}` : '/api/footage/list';

  try {
    const res = await fetch(url);
    const data = await res.json();
    allItems = data.items || [];
    renderGrid();
    populateCameraFilter();
  } catch (e) {
    showToast('Failed to load footage: ' + e.message);
  } finally {
    $('loading').style.display = 'none';
  }
}

function populateCameraFilter() {
  const camIds = [...new Set(allItems.map(i => i.camera_id))];
  const current = $('camFilter').value;
  $('camFilter').innerHTML = '<option value="">All Cameras</option>' +
    camIds.map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${c}</option>`).join('');
}

// --- Render grid ---
function renderGrid() {
  const grid = $('grid');
  $('totalCount').textContent = `${allItems.length} clip${allItems.length !== 1 ? 's' : ''}`;

  if (allItems.length === 0) {
    $('empty').style.display = 'block';
    grid.style.display = 'none';
    return;
  }

  $('empty').style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = allItems.map(item => {
    const isSelected = selectedPaths.has(item.path);
    return `
      <div class="card ${isSelected ? 'selected' : ''}" data-path="${item.path}">
        <div class="card-video">
          <div class="card-checkbox">
            <input type="checkbox" class="clip-checkbox" data-path="${item.path}" ${isSelected ? 'checked' : ''}>
          </div>
          <div class="play-overlay" onclick="playVideo('${item.path}')">
            <span class="play-icon">▶️</span>
          </div>
          <video preload="metadata" muted
            src="/api/footage/stream?path=${encodeURIComponent(item.path)}#t=0.1"
            onloadeddata="this.currentTime=0.1"></video>
        </div>
        <div class="card-info">
          <div class="name">${item.name}</div>
          <div class="meta">
            <span>📷 ${item.camera_id}</span>
            <span>📦 ${formatSize(item.size)}</span>
            <span>🕐 ${formatDate(item.created_at)}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Attach checkbox listeners
  document.querySelectorAll('.clip-checkbox').forEach(cb => {
    cb.addEventListener('change', (e) => {
      e.stopPropagation();
      const path = cb.dataset.path;
      if (cb.checked) {
        selectedPaths.add(path);
        cb.closest('.card').classList.add('selected');
      } else {
        selectedPaths.delete(path);
        cb.closest('.card').classList.remove('selected');
      }
      updateSelectionUI();
    });
  });

  updateSelectionUI();
}

// --- Selection UI updates ---
function updateSelectionUI() {
  const count = selectedPaths.size;
  $('selectedCount').textContent = count;
  $('deleteSelectedBtn').disabled = count === 0;

  const allCheckable = document.querySelectorAll('.clip-checkbox');
  const allChecked = allCheckable.length > 0 && allCheckedCount() === allCheckable.length;
  $('selectAll').checked = allChecked;
}

function allCheckedCount() {
  let n = 0;
  document.querySelectorAll('.clip-checkbox').forEach(cb => { if (cb.checked) n++; });
  return n;
}

// --- Select All ---
 $('selectAll').addEventListener('change', (e) => {
  const checked = e.target.checked;
  document.querySelectorAll('.clip-checkbox').forEach(cb => {
    cb.checked = checked;
    const path = cb.dataset.path;
    if (checked) {
      selectedPaths.add(path);
      cb.closest('.card').classList.add('selected');
    } else {
      selectedPaths.delete(path);
      cb.closest('.card').classList.remove('selected');
    }
  });
  updateSelectionUI();
});

// --- Delete Selected ---
 $('deleteSelectedBtn').addEventListener('click', () => {
  const count = selectedPaths.size;
  if (count === 0) return;
  showConfirm(
    `Delete ${count} clip${count !== 1 ? 's' : ''}?`,
    `You are about to permanently delete ${count} clip${count !== 1 ? 's' : ''}. This cannot be undone.`,
    () => deletePaths([...selectedPaths])
  );
});

// --- Delete All ---
 $('deleteAllBtn').addEventListener('click', () => {
  if (allItems.length === 0) return;
  showConfirm(
    `Delete ALL ${allItems.length} clips?`,
    `This will permanently delete every clip${$('camFilter').value ? ' for this camera' : ''}. This cannot be undone.`,
    () => deletePaths(allItems.map(i => i.path))
  );
});

// --- Show confirmation modal ---
function showConfirm(title, msg, onConfirm) {
  $('confirmTitle').textContent = title;
  $('confirmMsg').textContent = msg;
  pendingDeleteAction = onConfirm;
  $('confirmModal').classList.add('active');
}

function closeConfirm() {
  $('confirmModal').classList.remove('active');
  pendingDeleteAction = null;
}

 $('confirmDeleteBtn').addEventListener('click', () => {
  if (pendingDeleteAction) pendingDeleteAction();
  closeConfirm();
});

// --- Batch delete ---
async function deletePaths(paths) {
  try {
    showToast(`Deleting ${paths.length} clip${paths.length !== 1 ? 's' : ''}...`);
    const res = await fetch('/api/footage/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths: paths }),
    });
    const data = await res.json();

    if (data.ok || data.deleted_count > 0) {
      // Clear deleted items from selection
      data.deleted.forEach(p => selectedPaths.delete(p));
      showToast(`✅ Deleted ${data.deleted_count} clip${data.deleted_count !== 1 ? 's' : ''}`);

      if (data.failed && data.failed.length > 0) {
        showToast(`⚠️ ${data.failed.length} clip(s) failed to delete`);
      }
      // Reload footage
      await loadFootage();
    } else {
      showToast('❌ Delete failed: ' + (data.error || 'Unknown error'));
    }
  } catch (e) {
    showToast('❌ Delete failed: ' + e.message);
  }
}

// --- Video player ---
function playVideo(path) {
  const player = $('player');
  player.src = `/api/footage/stream?path=${encodeURIComponent(path)}`;
  $('playerModal').classList.add('active');
}

function closePlayer() {
  const player = $('player');
  player.pause();
  player.src = '';
  $('playerModal').classList.remove('active');
}

 $('playerModal').addEventListener('click', (e) => {
  if (e.target === $('playerModal')) closePlayer();
});

// --- Event listeners ---
 $('camFilter').addEventListener('change', () => {
  selectedPaths.clear();
  loadFootage();
});

 $('refreshBtn').addEventListener('click', () => {
  selectedPaths.clear();
  loadFootage();
});

// --- Initial load ---
loadFootage();
</script>
</body>
</html>
