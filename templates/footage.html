<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Footage Archive — CCTV Command Center</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #08101c;
      --panel: #0e1826;
      --border: #1e2d3d;
      --text: #e8eef8;
      --muted: #6b7a8f;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.4);
      --success: #10b981;
      --danger: #ef4444;
      --warn: #f59e0b;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f1f5f9; --panel: #ffffff; --border: #e2e8f0; --text: #0f172a; --muted: #64748b; }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 0.875rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; flex-wrap: wrap; gap: 1rem; }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    .header-controls { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .filter-group { display: flex; gap: 0.5rem; align-items: center; }
    select, input[type="date"] { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.75rem; border-radius: 8px; font-size: 0.8rem; }
    .btn { padding: 0.5rem 1rem; border: none; border-radius: 8px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-primary { background: var(--accent); color: white; }
    main { flex: 1; padding: 1.5rem; overflow-y: auto; }
    .footage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .footage-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: transform 0.2s; }
    .footage-card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
    .footage-thumb { position: relative; width: 100%; aspect-ratio: 16/9; background: #050810; overflow: hidden; }
    .footage-thumb video { width: 100%; height: 100%; object-fit: cover; }
    .footage-thumb canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .footage-info { padding: 1rem; }
    .footage-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .footage-meta { display: flex; gap: 1rem; font-size: 0.7rem; color: var(--muted); flex-wrap: wrap; }
    .footage-meta span { display: flex; align-items: center; gap: 0.25rem; }
    .ai-scan-badge { font-size: 0.6rem; padding: 0.15rem 0.5rem; border-radius: 999px; background: rgba(245,158,11,0.2); color: var(--warn); border: 1px solid rgba(245,158,11,0.3); }
    .ai-scan-badge.done { background: rgba(16,185,129,0.2); color: var(--success); border-color: rgba(16,185,129,0.3); }
    .ai-scan-badge.error { background: rgba(239,68,68,0.2); color: var(--danger); border-color: rgba(239,68,68,0.3); }
    
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal-content { width: 100%; max-width: 1200px; height: 85vh; max-height: 85vh; background: #000; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .modal-header { padding: 1rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-size: 1rem; font-weight: 600; }
    .modal-close { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; color: white; font-size: 1.5rem; cursor: pointer; }
    .modal-body { flex: 1; display: flex; flex-direction: column; }
    .modal-video-wrap { flex: 1; position: relative; background: #000; }
    .modal-video-wrap video { width: 100%; height: 100%; object-fit: contain; }
    .modal-video-wrap canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    .modal-controls { padding: 1rem 1.5rem; display: flex; gap: 1rem; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); }
    .control-btn { padding: 0.5rem 1rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    .control-btn.primary { background: var(--accent); border-color: var(--accent); }
    .time-display { font-variant-numeric: tabular-nums; font-size: 0.9rem; color: var(--muted); min-width: 120px; text-align: center; }
    .detection-timeline { padding: 0 1.5rem 1rem; display: flex; gap: 0.5rem; overflow-x: auto; }
    .timeline-marker { padding: 0.25rem 0.75rem; background: rgba(16,185,129,0.2); color: var(--success); border-radius: 999px; font-size: 0.7rem; font-weight: 600; white-space: nowrap; cursor: pointer; border: 1px solid rgba(16,185,129,0.3); }
    .empty-state { text-align: center; padding: 3rem; color: var(--muted); }
    .empty-state svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: 0.5; }
    .loading-skeleton { background: linear-gradient(90deg, var(--border) 25%, var(--panel) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 14px; height: 200px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>
  <header>
    <h1>📁 Footage Archive</h1>
    <div class="header-controls">
      <div class="filter-group">
        <label for="cameraFilter" style="font-size:0.75rem;color:var(--muted)">Camera</label>
        <select id="cameraFilter"><option value="">All Cameras</option></select>
      </div>
      <div class="filter-group">
        <label for="dateFilter" style="font-size:0.75rem;color:var(--muted)">Date</label>
        <input type="date" id="dateFilter">
      </div>
      <a href="/dashboard" class="btn btn-ghost">← Dashboard</a>
    </div>
  </header>
  <main>
    <div class="footage-grid" id="footageGrid">
      <!-- Populated by JS -->
    </div>
  </main>

  <!-- Footage Player Modal -->
  <div class="modal-overlay" id="playerModal" role="dialog" aria-modal="true" aria-label="Footage playback">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Footage Playback</h2>
        <button class="modal-close" id="playerClose" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-video-wrap" id="playerVideoWrap">
          <video id="playerVideo" controls playsinline></video>
          <canvas id="playerCanvas"></canvas>
        </div>
        <div class="detection-timeline" id="detectionTimeline" aria-label="Detection timestamps"></div>
        <div class="modal-controls">
          <button class="control-btn" id="btnScanAI" aria-label="Run AI detection on this clip">🧠 Scan for Humans</button>
          <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
          <button class="control-btn primary" id="btnDownload" aria-label="Download clip">⬇ Download</button>
        </div>
      </div>
    </div>
  </div>

  <script>
// ─── CONFIG & STATE ───
const API_BASE = '';
let allFootage = [];
let cocoSsdModel = null;
let tfReady = false;
let currentFootage = null;
let detectionMarkers = []; // { time, label }
let scanWorker = null;

// ─── DOM ───
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);
const footageGrid = $('#footageGrid');
const cameraFilter = $('#cameraFilter');
const dateFilter = $('#dateFilter');
const playerModal = $('#playerModal');
const playerVideo = $('#playerVideo');
const playerCanvas = $('#playerCanvas');
const playerClose = $('#playerClose');
const modalTitle = $('#modalTitle');
const timeDisplay = $('#timeDisplay');
const btnScanAI = $('#btnScanAI');
const btnDownload = $('#btnDownload');
const detectionTimeline = $('#detectionTimeline');
const playerVideoWrap = $('#playerVideoWrap');

// ─── INIT ───
async function init() {
  dateFilter.valueAsDate = new Date();
  await loadTensorFlow();
  await fetchCamerasForFilter();
  await fetchFootage();
  setupEventListeners();
}

async function loadTensorFlow() {
  try {
    await tf.ready();
    cocoSsdModel = await cocoSsd.load();
    tfReady = true;
    console.log('[TF.js] coco-ssd loaded for footage analysis');
  } catch (err) {
    console.error('[TF.js] Load failed:', err);
  }
}

async function fetchCamerasForFilter() {
  try {
    const res = await fetch(`${API_BASE}/api/admin/cameras`);
    const cameras = await res.json();
    cameraFilter.innerHTML = '<option value="">All Cameras</option>' +
      cameras.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join('');
  } catch (err) {
    console.error('[Footage] Camera filter fetch failed:', err);
  }
}

async function fetchFootage() {
  const cameraId = cameraFilter.value || null;
  const date = dateFilter.value || null;
  
  footageGrid.innerHTML = '<div class="loading-skeleton" style="grid-column:1/-1"></div>';
  
  try {
    const params = new URLSearchParams();
    if (cameraId) params.append('camera_id', cameraId);
    if (date) params.append('date', date);
    
    const res = await fetch(`${API_BASE}/api/admin/footage/list?${params}`);
    allFootage = await res.json();
    renderFootageGrid();
  } catch (err) {
    console.error('[Footage] Fetch failed:', err);
    footageGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><p>Failed to load footage</p></div>`;
  }
}

function renderFootageGrid() {
  footageGrid.innerHTML = '';
  if (allFootage.length === 0) {
    footageGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M8 12l3 3 6-6"/></svg><p>No footage found for selected filters</p></div>`;
    return;
  }
  
  allFootage.forEach((file, idx) => {
    const card = document.createElement('div');
    card.className = 'footage-card';
    card.innerHTML = `
      <div class="footage-thumb" data-index="${idx}">
        <video id="thumb-${idx}" playsinline muted preload="metadata"></video>
        <canvas id="thumb-canvas-${idx}" class="hidden"></canvas>
      </div>
      <div class="footage-info">
        <div class="footage-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>
        <div class="footage-meta">
          <span>📷 ${escapeHtml(file.camera_id)}</span>
          <span>📅 ${escapeHtml(file.date)}</span>
          <span>💾 ${formatBytes(file.size)}</span>
        </div>
        <div class="footage-meta" style="margin-top:0.5rem">
          <span class="ai-scan-badge" id="ai-badge-${idx}" data-scanned="false">🔍 Scan for Humans</span>
        </div>
      </div>
    `;
    footageGrid.appendChild(card);
    
    // Click to open player
    card.querySelector('.footage-thumb').addEventListener('click', () => openPlayer(idx));
    
    // Load thumbnail (first frame)
    loadVideoThumbnail(file.signed_url, idx);
  });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

async function loadVideoThumbnail(url, index) {
  const video = document.getElementById(`thumb-${index}`);
  if (!video) return;
  video.src = url;
  video.muted = true;
  video.preload = 'metadata';
  video.currentTime = 1;
  video.onloadeddata = () => { video.currentTime = 0; };
}

function setupEventListeners() {
  cameraFilter.addEventListener('change', fetchFootage);
  dateFilter.addEventListener('change', fetchFootage);
  playerClose.addEventListener('click', closePlayer);
  playerModal.addEventListener('click', (e) => { if (e.target === playerModal) closePlayer(); });
  
  playerVideo.addEventListener('timeupdate', updateTimeDisplay);
  playerVideo.addEventListener('loadedmetadata', () => updateTimeDisplay());
  
  btnScanAI.addEventListener('click', scanCurrentFootage);
  btnDownload.addEventListener('click', downloadCurrentFootage);
  
  // Click timeline marker to seek
  detectionTimeline.addEventListener('click', (e) => {
    const marker = e.target.closest('.timeline-marker');
    if (marker) {
      playerVideo.currentTime = parseFloat(marker.dataset.time);
    }
  });
}

function updateTimeDisplay() {
  const ct = playerVideo.currentTime || 0;
  const dt = playerVideo.duration || 0;
  timeDisplay.textContent = `${formatTime(ct)} / ${formatTime(dt)}`;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

async function openPlayer(index) {
  currentFootage = allFootage[index];
  if (!currentFootage) return;
  
  modalTitle.textContent = currentFootage.name;
  playerVideo.src = currentFootage.signed_url;
  playerVideo.load();
  
  playerVideo.onloadedmetadata = () => {
    playerCanvas.width = playerVideo.videoWidth;
    playerCanvas.height = playerVideo.videoHeight;
  };
  
  detectionTimeline.innerHTML = '';
  detectionMarkers = [];
  btnScanAI.textContent = '🧠 Scan for Humans';
  btnScanAI.disabled = false;
  btnScanAI.classList.remove('primary');
  
  playerModal.classList.add('open');
  document.body.style.overflow = 'hidden';
  
  try { await playerVideo.play(); } catch {}
}

function closePlayer() {
  playerModal.classList.remove('open');
  document.body.style.overflow = '';
  playerVideo.pause();
  playerVideo.src = '';
  currentFootage = null;
  detectionMarkers = [];
  stopScanWorker();
}

async function downloadCurrentFootage() {
  if (!currentFootage) return;
  try {
    const res = await fetch(currentFootage.signed_url);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentFootage.name;
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    console.error('[Footage] Download failed:', err);
  }
}

// ─── AI SCANNING (Web Worker for non-blocking) ───
function scanCurrentFootage() {
  if (!currentFootage || !tfReady) {
    alert('TensorFlow.js not ready. Please wait.');
    return;
  }
  
  btnScanAI.textContent = '⏳ Scanning...';
  btnScanAI.disabled = true;
  detectionTimeline.innerHTML = '<span style="color:var(--muted);font-size:0.8rem">Analyzing video frames...</span>';
  
  // Use Web Worker for heavy lifting
  if (typeof Worker !== 'undefined') {
    startScanWorker();
  } else {
    // Fallback: main thread (will block UI on large files)
    scanMainThread();
  }
}

function startScanWorker() {
  const workerCode = `
    const tf = self.tf;
    const cocoSsd = self.cocoSsd;
    
    let model = null;
    
    async function loadModel() {
      if (!model) {
        await tf.ready();
        model = await cocoSsd.load();
      }
      return model;
    }
    
    self.onmessage = async (e) => {
      const { videoUrl, frameInterval } = e.data;
      try {
        const model = await loadModel();
        
        // Create offscreen video
        const video = document.createElement('video');
        video.src = videoUrl;
        video.muted = true;
        video.crossOrigin = 'anonymous';
        
        await new Promise((resolve, reject) => {
          video.onloadedmetadata = resolve;
          video.onerror = reject;
          video.load();
        });
        
        const duration = video.duration;
        const canvas = new OffscreenCanvas(video.videoWidth, video.videoHeight);
        const ctx = canvas.getContext('2d');
        
        const detections = [];
        
        for (let t = 0; t < duration; t += frameInterval) {
          video.currentTime = t;
          await new Promise(r => video.onseeked = r);
          
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const preds = await model.detect(canvas);
          
          const persons = preds.filter(p => p.class === 'person' && p.score > 0.5);
          if (persons.length > 0) {
            detections.push({ time: t, count: persons.length, maxScore: Math.max(...persons.map(p => p.score)) });
          }
          
          self.postMessage({ progress: t / duration, detections: [...detections] });
        }
        
        self.postMessage({ done: true, detections });
      } catch (err) {
        self.postMessage({ error: err.message });
      }
    };
  `;
  
  const blob = new Blob([workerCode], { type: 'application/javascript' });
  scanWorker = new Worker(URL.createObjectURL(blob));
  
  scanWorker.onmessage = (e) => {
    const data = e.data;
    if (data.error) {
      detectionTimeline.innerHTML = `<span class="ai-scan-badge error">❌ ${escapeHtml(data.error)}</span>`;
      btnScanAI.textContent = '🔄 Retry Scan';
      btnScanAI.disabled = false;
      stopScanWorker();
      return;
    }
    
    if (data.progress !== undefined) {
      detectionTimeline.innerHTML = `<span style="color:var(--muted);font-size:0.8rem">Scanning: ${(data.progress*100).toFixed(0)}% complete...</span>`;
    }
    
    if (data.done) {
      detectionMarkers = data.detections;
      renderDetectionTimeline();
      btnScanAI.textContent = '✅ Scan Complete';
      btnScanAI.classList.add('primary');
      updateFootageBadge(currentFootage, true);
      stopScanWorker();
    }
  };
  
  scanWorker.postMessage({ videoUrl: currentFootage.signed_url, frameInterval: 2 }); // Scan every 2 seconds
}

function stopScanWorker() {
  if (scanWorker) {
    scanWorker.terminate();
    scanWorker = null;
  }
}

async function scanMainThread() {
  // Fallback for browsers without Worker support
  const video = document.createElement('video');
  video.src = currentFootage.signed_url;
  video.muted = true;
  video.crossOrigin = 'anonymous';
  
  await new Promise((resolve, reject) => {
    video.onloadedmetadata = resolve;
    video.onerror = reject;
    video.load();
  });
  
  const duration = video.duration;
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  
  const detections = [];
  
  for (let t = 0; t < duration; t += 2) {
    video.currentTime = t;
    await new Promise(r => video.onseeked = r);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const preds = await cocoSsdModel.detect(canvas);
    const persons = preds.filter(p => p.class === 'person' && p.score > 0.5);
    if (persons.length > 0) {
      detections.push({ time: t, count: persons.length, maxScore: Math.max(...persons.map(p => p.score)) });
    }
    detectionTimeline.innerHTML = `<span style="color:var(--muted);font-size:0.8rem">Scanning: ${(t/duration*100).toFixed(0)}%...</span>`;
  }
  
  detectionMarkers = detections;
  renderDetectionTimeline();
  btnScanAI.textContent = '✅ Scan Complete';
  btnScanAI.classList.add('primary');
  btnScanAI.disabled = false;
  updateFootageBadge(currentFootage, true);
}

function renderDetectionTimeline() {
  if (detectionMarkers.length === 0) {
    detectionTimeline.innerHTML = '<span class="ai-scan-badge" style="background:rgba(107,114,128,0.2);color:var(--muted);border-color:rgba(107,114,128,0.3)">No humans detected</span>';
    return;
  }
  
  detectionTimeline.innerHTML = detectionMarkers.map(d => 
    `<span class="timeline-marker" data-time="${d.time}" title="${d.count} person(s) at ${formatTime(d.time)} (confidence: ${(d.maxScore*100).toFixed(0)}%)">👤 ${formatTime(d.time)} ×${d.count}</span>`
  ).join('');
}

function updateFootageBadge(footage, scanned) {
  const idx = allFootage.findIndex(f => f.path === footage.path);
  if (idx >= 0) {
    const badge = document.getElementById(`ai-badge-${idx}`);
    if (badge) {
      badge.textContent = scanned ? '✅ Humans Detected' : '🔍 Scan for Humans';
      badge.classList.toggle('done', scanned);
      badge.dataset.scanned = scanned;
    }
  }
}

// ─── START ───
init();
  </script>
</body>
</html>
