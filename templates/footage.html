<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎞 Footage • CCTV</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0b1220;color:#e6edf7;font-family:system-ui,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;padding:12px 18px;background:#0e1626;border-bottom:1px solid #1c2740;position:sticky;top:0;z-index:10}
  header .brand{font-weight:700}
  header .spacer{flex:1}
  header a{color:#9db6e6;text-decoration:none;margin-left:16px;font-size:14px}
  header a.active{color:#fff}
  main{padding:18px;max-width:1400px;margin:0 auto;display:grid;grid-template-columns:320px 1fr;gap:16px}
  @media(max-width:800px){ main{grid-template-columns:1fr} }
  .side{background:#131b2e;border:1px solid #22304d;border-radius:14px;padding:12px;max-height:80vh;overflow:auto}
  .side h3{margin:6px 0 12px;font-size:13px;letter-spacing:.3px;opacity:.75}
  select{width:100%;padding:9px;border-radius:10px;background:#0e1626;color:#e6edf7;border:1px solid #2a3a5c;margin-bottom:10px}
  .item{padding:10px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid transparent}
  .item:hover{background:#1a2340}
  .item.active{background:#1a2340;border-color:#4c8dff}
  .item .n{font-weight:600}
  .item .s{opacity:.55;font-size:11px;margin-top:2px}
  .empty{opacity:.55;font-size:13px;padding:20px;text-align:center}
  .player{background:#131b2e;border:1px solid #22304d;border-radius:14px;padding:12px}
  .stage{background:#000;border-radius:10px;position:relative;overflow:hidden;aspect-ratio:16/9}
  video, canvas.overlay{position:absolute;inset:0;width:100%;height:100%}
  canvas.overlay{pointer-events:none}
  .row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  button{background:#1b2440;color:#e6edf7;border:1px solid #2a3a5c;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer}
  button.primary{background:#4c8dff;border-color:#4c8dff;color:#fff}
  button.danger{background:#7b1d1d;border-color:#7b1d1d;color:#fff}
  .badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .badge.human{background:#155e2c;color:#5cf29a}
  .badge.none{background:#2a3a5c;color:#9db6e6}
  .meta{font-size:12px;opacity:.7}
</style>
</head>
<body>
<header>
  <div class="brand">🎞 Footage</div>
  <div class="spacer"></div>
  <a href="/dashboard">Dashboard</a>
  <a href="/footage" class="active">Footage</a>
  <a href="/logout">Logout</a>
</header>

<main>
  <aside class="side">
    <h3>CAMERA</h3>
    <select id="camSel"><option value="">All cameras</option></select>
    <h3>CLIPS</h3>
    <div id="list"></div>
  </aside>

  <section class="player">
    <div class="stage" id="stage">
      <video id="vid" controls playsinline preload="metadata"></video>
      <canvas class="overlay" id="ov"></canvas>
    </div>
    <div class="row">
      <div id="clipName" class="meta">Select a clip to play.</div>
      <span class="spacer" style="flex:1"></span>
      <span id="aiBadge" class="badge none">🧠 not scanned</span>
      <button id="btnScan">🔍 Scan for humans</button>
      <button id="btnDl" class="primary">⬇ Download</button>
      <button id="btnDel" class="danger">🗑 Delete</button>
    </div>
    <div id="detStatus" class="meta" style="margin-top:8px"></div>
  </section>
</main>

<script>
'use strict';

/* ============================================================
 * State
 * ============================================================ */
let items = [];
let current = null;   // { path, camera_id, name, ... }
let signedUrl = null;
let detector = null;
let scanning = false;
const MODE = localStorage.getItem('cctv_mode') || 'desktop';

const $ = id => document.getElementById(id);

/* ============================================================
 * Load list + camera selector
 * ============================================================ */
async function loadCameras(){
  const r = await fetch('/api/cameras'); const j = await r.json();
  const sel = $('camSel');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All cameras</option>' +
    (j.cameras||[]).map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  sel.value = cur;
}
async function loadList(){
  const cam = $('camSel').value;
  const url = cam ? `/api/footage/list?camera_id=${encodeURIComponent(cam)}` : '/api/footage/list';
  const r = await fetch(url); const j = await r.json();
  items = j.items || [];
  renderList();
}
function renderList(){
  const box = $('list');
  if (!items.length){ box.innerHTML = '<div class="empty">No clips yet.</div>'; return; }
  box.innerHTML = items.map((it,i) => `
    <div class="item" data-i="${i}">
      <div class="n">${escapeHtml(it.name)}</div>
      <div class="s">${it.camera_id} • ${fmtSize(it.size)} • ${fmtDate(it.created_at)}</div>
    </div>
  `).join('');
  box.querySelectorAll('.item').forEach(el => el.onclick = () => selectItem(+el.dataset.i));
}
$('camSel').onchange = loadList;

/* ============================================================
 * Playback via secure backend stream
 * ============================================================ */
async function selectItem(i){
  current = items[i];
  document.querySelectorAll('.item').forEach((el,idx) => el.classList.toggle('active', idx===i));
  $('clipName').textContent = current.name + '  •  ' + current.camera_id;
  $('aiBadge').className = 'badge none'; $('aiBadge').textContent = '🧠 not scanned';
  $('detStatus').textContent = '';
  // Use secure /api/footage/stream (private bucket) — cookie-authenticated
  const url = `/api/footage/stream?path=${encodeURIComponent(current.path)}`;
  $('vid').src = url;
  // Signed URL for optional download
  const sr = await fetch(`/api/footage/signed?path=${encodeURIComponent(current.path)}`);
  const sj = await sr.json(); signedUrl = sj.url || null;
  // In Mobile Mode we auto-scan on view (per spec: shift AI to footage)
  if (MODE === 'mobile') autoScanWhenReady();
}

$('btnDl').onclick = () => {
  if (!current) return;
  const url = signedUrl || `/api/footage/stream?path=${encodeURIComponent(current.path)}`;
  const a = document.createElement('a'); a.href = url; a.download = current.name; a.click();
};

$('btnDel').onclick = async () => {
  if (!current) return;
  if (!confirm('Delete '+current.name+' ?')) return;
  await fetch('/api/footage/delete', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ path: current.path }) });
  current = null; $('vid').removeAttribute('src'); $('vid').load();
  await loadList();
};

/* ============================================================
 * On-demand human detection (coco-ssd, main thread — clip playback is short)
 * ============================================================ */
async function ensureDetector(){
  if (detector) return detector;
  $('detStatus').textContent = 'Loading detector…';
  await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');
  await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');
  await tf.setBackend('webgl'); await tf.ready();
  detector = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
  $('detStatus').textContent = 'Detector ready.';
  return detector;
}
function loadScript(src){
  return new Promise((res, rej) => {
    if ([...document.scripts].some(s=>s.src===src)) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function autoScanWhenReady(){
  const v = $('vid');
  if (!v.readyState) v.onloadeddata = () => scanClip();
  else scanClip();
}

$('btnScan').onclick = () => scanClip();

async function scanClip(){
  if (!current || scanning) return;
  scanning = true;
  const v = $('vid'), ov = $('ov'), ctx = ov.getContext('2d');
  try{
    await ensureDetector();
    ov.width = v.videoWidth || 640; ov.height = v.videoHeight || 360;
    // Sample up to 6 frames spread over the clip
    const samples = 6;
    const dur = v.duration && isFinite(v.duration) ? v.duration : 15;
    let anyHuman = false, total = 0;
    for (let i=0; i<samples; i++){
      const t = (i + 0.5) * (dur / samples);
      await seekTo(v, t);
      const preds = await detector.detect(v, 5, 0.5);
      ctx.clearRect(0,0,ov.width, ov.height);
      ctx.lineWidth = 3; ctx.strokeStyle = '#5cf29a'; ctx.fillStyle = '#5cf29a'; ctx.font = 'bold 18px system-ui';
      for (const p of preds){
        if (p.class === 'person'){ anyHuman = true; total++; }
        const [x,y,w,h] = p.bbox;
        ctx.strokeRect(x,y,w,h);
        const lbl = `${p.class} ${(p.score*100|0)}%`;
        const tw = ctx.measureText(lbl).width + 10;
        ctx.fillRect(x, y-22, tw, 22);
        ctx.fillStyle = '#0b1220'; ctx.fillText(lbl, x+5, y-6);
        ctx.fillStyle = '#5cf29a';
      }
      $('detStatus').textContent = `Scanning… frame ${i+1}/${samples} at ${t.toFixed(1)}s`;
    }
    if (anyHuman){
      $('aiBadge').className = 'badge human';
      $('aiBadge').textContent = `👤 human detected (${total})`;
    } else {
      $('aiBadge').className = 'badge none';
      $('aiBadge').textContent = '✓ no humans found';
    }
    $('detStatus').textContent = 'Scan complete.';
    // Rewind for viewing
    v.currentTime = 0;
  } catch(e){
    $('detStatus').textContent = 'Scan failed: '+e.message;
  } finally {
    scanning = false;
  }
}
function seekTo(v, t){
  return new Promise(res => {
    const on = () => { v.removeEventListener('seeked', on); res(); };
    v.addEventListener('seeked', on);
    try{ v.currentTime = Math.min(t, (v.duration||t)-0.05); }catch{ res(); }
  });
}

/* ============================================================
 * Utils
 * ============================================================ */
function fmtSize(b){ if (!b) return '—'; const u=['B','KB','MB','GB']; let i=0; while(b>=1024 && i<3){ b/=1024; i++; } return b.toFixed(1)+' '+u[i]; }
function fmtDate(s){ if (!s) return ''; try{ return new Date(s).toLocaleString(); }catch{ return s; } }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
 * Boot
 * ============================================================ */
(async () => {
  await loadCameras();
  await loadList();
  setInterval(loadList, 15000);
})();
</script>
</body>
</html>
