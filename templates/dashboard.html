<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard • CCTV</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#e6edf7;min-height:100vh}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;
         background:#131b2e;border-bottom:1px solid #22304d;position:sticky;top:0;z-index:100}
    .nav-left{display:flex;align-items:center;gap:16px}
    .nav h1{font-size:18px}
    .nav a{color:#4c8dff;text-decoration:none;font-size:14px}
    .container{padding:20px;max-width:1400px;margin:0 auto}
    .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .btn{padding:8px 16px;border:0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
    .btn-primary{background:#4c8dff;color:#fff}
    .btn-secondary{background:#22304d;color:#e6edf7;border:1px solid #2a3a5c}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
    .cam-card{background:#131b2e;border:1px solid #22304d;border-radius:12px;overflow:hidden}
    .cam-video{position:relative;aspect-ratio:16/9;background:#000}
    .cam-video video{width:100%;height:100%;object-fit:cover}
    .cam-status{position:absolute;top:8px;left:8px;padding:3px 10px;border-radius:6px;
                font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px}
    .cam-status.online{background:rgba(34,197,94,.2);color:#4ade80}
    .cam-status.offline{background:rgba(255,68,68,.2);color:#ff7676}
    .cam-status .dot{width:7px;height:7px;border-radius:50%}
    .cam-status.online .dot{background:#4ade80;animation:pulse 1.5s infinite}
    .cam-status.offline .dot{background:#ff7676}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .cam-info{padding:12px 14px}
    .cam-info .name{font-size:15px;font-weight:600}
    .cam-info .meta{font-size:12px;opacity:.5;margin-top:4px}
    .cam-actions{display:flex;gap:8px;margin-top:10px}
    .cam-actions button{flex:1;padding:8px;border:0;border-radius:8px;font-size:13px;
                        font-weight:600;cursor:pointer}
    .btn-view{background:#4c8dff;color:#fff}
    .btn-view:disabled{opacity:.4;cursor:not-allowed}
    .btn-footage{background:#22304d;color:#e6edf7;border:1px solid #2a3a5c}
    .empty{text-align:center;padding:60px 20px;opacity:.5}
    .empty .icon{font-size:48px;margin-bottom:10px}
    .placeholder{display:flex;align-items:center;justify-content:center;height:100%;
                 color:#445;font-size:14px;flex-direction:column;gap:8px}
  </style>
</head>
<body>

<div class="nav">
  <div class="nav-left">
    <h1>🎥 CCTV Dashboard</h1>
    <a href="/footage">🎬 Footage</a>
  </div>
  <a href="/logout">Logout</a>
</div>

<div class="container">
  <div class="toolbar">
    <button class="btn btn-primary" id="refreshBtn">🔄 Refresh Cameras</button>
    <span style="opacity:.6;font-size:13px" id="camCount">0 cameras</span>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="icon">📹</div>
    <div>No cameras registered yet</div>
    <div style="margin-top:8px;font-size:13px">Open <a href="/camera" style="color:#4c8dff">/camera</a> on a device to add a camera</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
//  Dashboard – lists cameras and establishes WebRTC connections
// ═══════════════════════════════════════════════════════════════════════

let cameras = [];
let iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];
let activeConnections = new Map();  // camera_id -> { pc, sessionId, iceInterval }

const $ = id => document.getElementById(id);

async function loadConfig() {
  try {
    const res = await fetch('/api/config');
    const data = await res.json();
    if (data.iceServers) iceServers = data.iceServers;
  } catch (e) { /* use defaults */ }
}

async function loadCameras() {
  try {
    const res = await fetch('/api/cameras');
    const data = await res.json();
    cameras = data.cameras || [];
    renderCameras();
  } catch (e) {
    console.error('Failed to load cameras:', e);
  }
}

function renderCameras() {
  const grid = $('grid');
  $('camCount').textContent = `${cameras.length} camera${cameras.length !== 1 ? 's' : ''}`;

  if (cameras.length === 0) {
    grid.innerHTML = '';
    $('empty').style.display = 'block';
    return;
  }

  $('empty').style.display = 'none';
  grid.innerHTML = cameras.map(cam => {
    const statusClass = cam.online ? 'online' : 'offline';
    const statusText  = cam.online ? 'ONLINE' : 'OFFLINE';
    const lastSeen = cam.online ? 'Live' : `Last seen ${timeAgo(cam.last_ping)}`;

    return `
      <div class="cam-card" data-cam-id="${cam.id}">
        <div class="cam-video">
          <div class="cam-status ${statusClass}">
            <span class="dot"></span> ${statusText}
          </div>
          <video id="video-${cam.id}" autoplay muted playsinline></video>
          <div class="placeholder" id="placeholder-${cam.id}">
            <span>📹</span>
            <span>${cam.online ? 'Click "View Live" to connect' : 'Camera offline'}</span>
          </div>
        </div>
        <div class="cam-info">
          <div class="name">${cam.name}</div>
          <div class="meta">ID: ${cam.id} • ${lastSeen}</div>
          <div class="cam-actions">
            <button class="btn-view" onclick="connectCamera('${cam.id}')" ${cam.online ? '' : 'disabled'}>
              ▶️ View Live
            </button>
            <button class="btn-footage" onclick="window.location.href='/footage?camera_id=${cam.id}'">
              🎬 Footage
            </button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function timeAgo(ts) {
  if (!ts) return 'never';
  const diff = Math.floor(Date.now() / 1000 - ts);
  if (diff < 60) return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

// --- WebRTC: connect to camera ---
async function connectCamera(camId) {
  // Disconnect existing connection if any
  disconnectCamera(camId);

  const videoEl = document.getElementById(`video-${camId}`);
  const placeholder = document.getElementById(`placeholder-${camId}`);

  try {
    const pc = new RTCPeerConnection({ iceServers });

    // Receive video/audio from camera
    pc.ontrack = (event) => {
      videoEl.srcObject = event.streams[0];
      if (placeholder) placeholder.style.display = 'none';
    };

    // Add recvonly transceivers
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });

    // Create offer
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    // Send offer to camera via server
    const res = await fetch('/api/webrtc/offer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ camera_id: camId, sdp: offer.sdp }),
    });
    if (!res.ok) throw new Error('Offer rejected');
    const data = await res.json();
    const sessionId = data.session;

    // Send ICE candidates to camera
    pc.onicecandidate = async (event) => {
      if (event.candidate) {
        await fetch('/api/webrtc/ice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session: sessionId,
            candidate: event.candidate,
            to: 'camera',
          }),
        });
      }
    };

    // Poll for answer from camera
    const answerPoll = setInterval(async () => {
      try {
        const res = await fetch(`/api/webrtc/answer?session=${sessionId}`);
        const data = await res.json();
        if (data.answer) {
          clearInterval(answerPoll);
          await pc.setRemoteDescription(data.answer);

          // Start polling for ICE candidates from camera
          const icePoll = setInterval(async () => {
            if (pc.connectionState === 'closed' || pc.connectionState === 'failed') {
              clearInterval(icePoll);
              return;
            }
            try {
              const res = await fetch(`/api/webrtc/ice?session=${sessionId}&to=admin`);
              const data = await res.json();
              if (data.candidates) {
                for (const c of data.candidates) {
                  await pc.addIceCandidate(c);
                }
              }
            } catch (e) { /* ignore */ }
          }, 1000);

          activeConnections.set(camId, { pc, sessionId, iceInterval: icePoll });
        }
      } catch (e) { /* ignore */ }
    }, 1000);

    // Timeout: if no answer in 10s, stop polling
    setTimeout(() => clearInterval(answerPoll), 10000);

  } catch (e) {
    console.error('Connection failed:', e);
  }
}

function disconnectCamera(camId) {
  const conn = activeConnections.get(camId);
  if (conn) {
    if (conn.iceInterval) clearInterval(conn.iceInterval);
    conn.pc.close();
    activeConnections.delete(camId);
  }
}

// --- Auto-refresh camera list ---
let refreshTimer = setInterval(loadCameras, 10000);

 $('refreshBtn').addEventListener('click', loadCameras);

// --- Init ---
loadConfig().then(loadCameras);

// Cleanup on unload
window.addEventListener('beforeunload', () => {
  activeConnections.forEach((conn, camId) => disconnectCamera(camId));
});
</script>
</body>
</html>
